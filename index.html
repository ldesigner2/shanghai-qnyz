<body>
<div class="header">

  </div>
</div>
<div id="map"></div>
<div class="toggle-btn" id="toggleBtn">◀</div>

<div class="sidebar" id="sidebar">

  <div class="date-row"><label>离店</label><input type="date" id="dateTo"></div>
  <button class="query-btn" id="queryBtn">查询</button>
  <div style="font-size:10px;color:#666;margin:6px 0 4px;">Bark Key</div>
  <input type="text" id="barkKey" placeholder="粘贴Bark Key" style="width:100%;padding:5px;font-size:11px;border:1px solid #ddd;border-radius:5px;margin-bottom:4px;">
  <button id="testBark" style="width:100%;padding:4px;font-size:10px;border:1px solid #3498db;border-radius:4px;background:#fff;color:#3498db;cursor:pointer;margin-bottom:6px;">测试推送</button>
  <button id="monitorBtn" style="width:100%;padding:6px;font-size:11px;border:none;border-radius:6px;background:#3498db;color:#fff;cursor:pointer;font-weight:600;margin-bottom:4px;">开始监控（每60秒刷新）</button>
  <div id="favList" style="font-size:10px;color:#666;"></div>
  <button id="clearFav" style="width:100%;padding:4px;font-size:10px;border:1px solid #e74c3c;border-radius:4px;background:#fff;color:#e74c3c;cursor:pointer;margin-top:4px;">清空全部监控</button>
  <div style="font-size:10px;color:#333;font-weight:600;margin-top:6px;display:flex;justify-content:space-between;">监控日志 <span onclick="clearLog()" style="color:#999;cursor:pointer;font-weight:400;">清空</span></div>
  <div id="monitorLog" style="font-size:10px;color:#666;max-height:120px;overflow-y:auto;border-top:1px solid #eee;padding-top:4px;margin-top:2px;"></div>

  <div class="section-title">筛选</div>
  <div class="rank-grid" id="rankGrid"></div>
  <div class="all-none-row">
    <button id="btnAll">全选</button>
    <button id="btnNone">全不选</button>
  </div>
  <div id="districtList"></div>
</div>

<div class="legend">
  <div style="font-weight:700;margin-bottom:4px;">图例</div>
  <div class="legend-row"><div class="legend-dot" style="background:#27ae60;"></div>有房可预约</div>
  <div class="legend-row"><div class="legend-dot" style="background:#bbb;"></div>无房/未上架</div>
</div>

<div class="result-panel" id="resultPanel">

    <span id="closePanel" style="display:none;cursor:pointer;font-size:18px;line-height:1;margin-left:auto;padding:0 4px;">×</span>
  </div>
  <input type="text" id="searchBox" placeholder="搜索驿站名称/区域..." style="width:100%;padding:6px 10px;font-size:12px;border:none;border-bottom:1px solid #eee;box-sizing:border-box;outline:none;">
  <div class="result-list" id="resultList"></div>
</div>
<button class="result-toggle" id="resultToggle" style="right:320px;">◀</button>
<button class="mobile-list-btn" id="mobileListBtn" style="display:none;position:fixed;bottom:20px;right:15px;z-index:1000;background:#27ae60;color:#fff;border:none;border-radius:24px;padding:12px 20px;font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer;">驿站列表</button>

const districtColors = {
  '黄浦区':'#e74c3c','静安区':'#9b59b6','徐汇区':'#3498db','长宁区':'#1abc9c',
  '普陀区':'#f39c12','虹口区':'#e67e22','杨浦区':'#2ecc71','浦东新区':'#34495e',
  '闵行区':'#16a085','宝山区':'#c0392b','嘉定区':'#8e44ad','松江区':'#27ae60',
  '青浦区':'#2980b9','奉贤区':'#d35400','金山区':'#7f8c8d','崇明区':'#16a085',
  '临港新片区':'#9b59b6'
};

let currentData = stationsData.map(s => ({...s}));
const allMarkers = {};
let onlyAvailable = false;  // 显示全部驿站
const activeRanks = new Set();
const checkedDistricts = new Set();

function createMarker(s) {
  const hasRoom = s.rooms > 0 && s.onShelf === "1";
  const color = hasRoom ? '#27ae60' : '#bbb';
  const size = 30, fontSize = 11;
  const star = favIds.includes(String(s.apiId)) ? '<div style="position:absolute;top:-6px;right:-6px;font-size:12px;color:#e74c3c;line-height:1;">★</div>' : '';
  const icon = L.divIcon({
    className:'',
    html:`<div style="position:relative;width:${size}px;height:${size}px;"><div class="num-marker" style="width:${size}px;height:${size}px;background:${color};font-size:${fontSize}px">${s.id}</div>${star}</div>`,
    iconSize:[size,size], iconAnchor:[size/2,size/2]
  });
  const roomsHtml = hasRoom
    ? `<div class="popup-rooms">可预约 ${s.rooms} 间</div>`
    : `<div class="popup-rooms none">暂无可预约房间</div>`;
  const badgeColor = districtColors[s.district]||'#666';
  const m = L.marker([s.lat, s.lng], { icon });
  const favBtn = favIds.includes(String(s.apiId))
    ? `<button onclick="toggleFav(${s.apiId})" style="margin-top:6px;width:100%;padding:5px;font-size:11px;border:none;border-radius:5px;background:#e74c3c;color:#fff;cursor:pointer;">取消监控</button>`
    : `<button onclick="toggleFav(${s.apiId})" style="margin-top:6px;width:100%;padding:5px;font-size:11px;border:none;border-radius:5px;background:#3498db;color:#fff;cursor:pointer;">监控此驿站</button>`;
  m.bindPopup(`
    <span class="popup-badge" style="background:${badgeColor}">编号 ${s.id}</span>
    <div class="popup-name">${s.name}</div>
    <div class="popup-district">${s.district}</div>
    ${roomsHtml}
    <div class="popup-desc">${s.desc}</div>
    <div class="popup-addr">${s.addr}</div>
    ${favBtn}
  `);
  return m;
}

function rebuildMarkers() {
  Object.values(allMarkers).forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
  Object.keys(allMarkers).forEach(k => delete allMarkers[k]);
  currentData.forEach(s => { allMarkers[s.apiId] = createMarker(s); });
  applyFilter();
}

function applyFilter() {
  // 清除所有标记
  Object.values(allMarkers).forEach(m => { if (map.hasLayer(m)) map.removeLayer(m); });
  let visible = currentData.slice();

  // 条件1：只看有房（独立开关）
  if (onlyAvailable) visible = visible.filter(s => s.rooms > 0 && s.onShelf === "1");

  // 条件2：区域筛选（独立，勾选几个算几个）
  if (checkedDistricts.size > 0) visible = visible.filter(s => checkedDistricts.has(s.district));

  // 条件3：排名分组（独立，多选叠加）
  if (activeRanks.size > 0) {
    visible = visible.filter(s => [...activeRanks].some(r => s.id >= r.min && s.id <= r.max));
  }

  visible.forEach(s => allMarkers[s.apiId].addTo(map));
  renderResultList(visible);
}

function renderResultList(list) {
  const el = document.getElementById('resultList');
  const availCount = list.filter(s => s.rooms>0 && s.onShelf==="1").length;
  document.getElementById('resultTitle').textContent = `${list.length}家 · ${availCount}家有房`;
  el.innerHTML = list.slice().sort((a,b) => a.id - b.id).map(s => {
    const hasRoom = s.rooms>0 && s.onShelf==="1";
    const isFav = favIds.includes(String(s.apiId));
    return `
      <div class="result-item" data-apiid="${s.apiId}">
        <span class="r-bell ${isFav?'on':''}" data-bell="${s.apiId}">${isFav?'★':'☆'}</span>
        <span class="r-num">#${s.id}</span><span class="r-name">${s.name.replace('青年驿站','')}</span>
        <div class="r-meta">${s.district} · ${hasRoom?`<span class="r-rooms">可约${s.rooms}间</span>`:'<span class="r-rooms none">满房</span>'}</div>
      </div>
    `;
  }).join('');
  el.querySelectorAll('.result-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (e.target.dataset.bell) return;
      const apiId = item.dataset.apiid;
      const s = currentData.find(x => String(x.apiId) === String(apiId));
      if (s) { map.setView([s.lat, s.lng], 15, {animate:false}); setTimeout(()=>{ if(window.innerWidth>768) map.panBy([-160, 0], {animate:true}); allMarkers[s.apiId].openPopup(); }, 50); }
    });
  });
  el.querySelectorAll('.r-bell').forEach(bell => {
    bell.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFav(bell.dataset.bell);
      bell.classList.toggle('on');
      bell.textContent = bell.classList.contains('on') ? '★' : '☆';
      if (monitorTimer) checkMonitor();
    });
  });
}

// 排名分组
const rankGroups = [
  {min:1,max:10,label:"1-10名",desc:"顶级推荐"},
  {min:11,max:20,label:"11-20名",desc:"市中心优选"},
  {min:21,max:30,label:"21-30名",desc:"市区便利"},
  {min:31,max:50,label:"31-50名",desc:"近郊通勤"},
  {min:51,max:93,label:"51名+",desc:"远郊配套"},
];
const rankGrid = document.getElementById('rankGrid');
rankGroups.forEach(rg => {
  const btn = document.createElement('div');
  btn.className = 'rank-btn';
  btn.innerHTML = `${rg.label}<span class="rank-desc">${rg.desc}</span>`;
  btn.addEventListener('click', () => {
    if (activeRanks.has(rg)) { activeRanks.delete(rg); btn.classList.remove('active'); }
    else { activeRanks.add(rg); btn.classList.add('active'); }
    applyFilter();
  });
  rankGrid.appendChild(btn);
});

// 区域列表
const hotDistricts = ['黄浦区','静安区','徐汇区','长宁区','虹口区','杨浦区','浦东新区','普陀区','闵行区','宝山区','嘉定区','松江区','青浦区','奉贤区','金山区','崇明区','临港新片区'];
const districts = [...new Set(currentData.map(s => s.district))].sort((a,b) => hotDistricts.indexOf(a) - hotDistricts.indexOf(b));
const districtListEl = document.getElementById('districtList');
districts.forEach(d => {
  const list = currentData.filter(s => s.district === d);
  const color = districtColors[d] || '#666';
  const availCount = list.filter(s => s.rooms > 0 && s.onShelf === "1").length;
  const label = document.createElement('label');
  label.className = 'checkbox-item';
  label.innerHTML = `<input type="checkbox" value="${d}"><div class="c-dot" style="background:${color}"></div><span>${d}</span><span class="c-rooms">${availCount}有房</span><span class="c-count">${list.length}</span>`;
  label.querySelector('input').addEventListener('change', (e) => {
    if (e.target.checked) checkedDistricts.add(d);
    else checkedDistricts.delete(d);
    applyFilter();
  });
  districtListEl.appendChild(label);
});
document.getElementById('btnAll').addEventListener('click', () => {
  document.querySelectorAll('#districtList input').forEach(cb => { cb.checked = true; checkedDistricts.add(cb.value); });
  applyFilter();
});
document.getElementById('btnNone').addEventListener('click', () => {
  document.querySelectorAll('#districtList input').forEach(cb => cb.checked = false);
  checkedDistricts.clear(); applyFilter();
});

// 刷新房源
async function refreshRooms() {
  try {
    const resp = await fetch('https://qnyz.shyouth.net/qnyzApi/hous/housListBatch', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({housType:1, pageNum:1, pageSize:200})
    });
    const json = await resp.json();
    if (json.success) {
      json.data.forEach(fs => {
        const ex = currentData.find(s => s.apiId === fs.id);
        if (ex) { ex.rooms = parseInt(fs.houseCount)||0; ex.onShelf = String(fs.isOnShelf||"0"); }
      });
      rebuildMarkers();
      // 更新右侧列表
      const ac = currentData.filter(s => s.rooms>0 && s.onShelf==="1").length;
      document.getElementById('statusBar').textContent = `已更新 · ${ac}家有房 · ${new Date().toLocaleTimeString()}`;
      document.getElementById('resultTitle').textContent = `共${currentData.length}家 · ${ac}家有房`;
    }
  } catch(e) {
    document.getElementById('statusBar').textContent = '跨域限制，显示缓存数据';
  }
}
document.getElementById('refreshBtn').addEventListener('click', async function() {
  this.disabled = true;
  document.getElementById('statusBar').textContent = '正在获取...';
  await refreshRooms();
  this.disabled = false;
});

// 按日期查询日历
document.getElementById('queryBtn').addEventListener('click', async function() {
  const dFrom = document.getElementById('dateFrom').value;
  const dTo = document.getElementById('dateTo').value;
  if (!dFrom || !dTo) { alert('请选择入住和离店日期'); return; }
  this.disabled = true;
  this.textContent = '正在查询日历...';
  // 重置所有房间数
  currentData.forEach(s => { s.rooms = 0; s.onShelf = "0"; s.dateRooms = 0; });
  // 逐个查日历
  let done = 0, total = currentData.length;
  for (const s of currentData) {
    try {
      const url = `https://qnyz.shyouth.net/qnyzApi/hous/calendar?id=${s.apiId}&startTime=${dFrom}&endTime=${dTo}`;
      const resp = await fetch(url);
      const json = await resp.json();
      if (json.success && json.data) {
        // 只筛选入住期间的日期：入住日当天到离店日前一天
        const stayNights = json.data.filter(day => {
          return day.applyDate >= dFrom && day.applyDate < dTo;
        });
        // 取入住期间每晚的最小可约数（任何一晚没房就住不了）
        let minRooms = 999;
        let hasData = false;
        stayNights.forEach(day => {
          hasData = true;
          const n = parseInt(day.applyNumber)||0;
          if (n < minRooms) minRooms = n;
        });
        if (hasData && minRooms > 0) { s.rooms = minRooms; s.onShelf = "1"; }
        else { s.rooms = 0; s.onShelf = "0"; }
      }
    } catch(e) {}
    done++;
    if (done % 20 === 0) this.textContent = `查询中... ${done}/${total}`;
  }
  rebuildMarkers();
  const availStations = currentData.filter(s => s.rooms>0 && s.onShelf==="1").sort((a,b)=>a.id-b.id);
  this.textContent = '查询';
  this.disabled = false;
  document.getElementById('statusBar').textContent = `${dFrom}至${dTo} · ${availStations.length}家可住`;
  renderResultList(availStations);
  document.getElementById('resultTitle').textContent = `${availStations.length}家可住 · ${dFrom.slice(5)}入住`;
  document.getElementById('resultPanel').classList.add('open');
  // 自动开始监控（如果有收藏的驿站）
  if (favIds.length > 0 && !monitorTimer) {
    if (Notification.permission !== 'granted') Notification.requestPermission();
    monitorFirstCheck = true;
    monitorTimer = setInterval(checkMonitor, 60000);
    const btn = document.getElementById('monitorBtn');
    btn.textContent = `停止监控（${favIds.length}家）`;
    btn.style.background = '#e74c3c';
    document.getElementById('statusBar').textContent = `监控中 · ${favIds.length}家 · ${dFrom}至${dTo}`;
    checkMonitor();
  }
});

// 重新打开右侧列表
document.getElementById('resultToggle').addEventListener('click', () => {
  const panel = document.getElementById('resultPanel');
  const btn = document.getElementById('resultToggle');
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    btn.style.right = '0';
    btn.textContent = '▶';
  } else {
    panel.classList.add('open');
    btn.style.right = '320px';
    btn.textContent = '◀';
  }
});

// 折叠
const sidebar = document.getElementById('sidebar');
const toggleBtn = document.getElementById('toggleBtn');
toggleBtn.addEventListener('click', () => {
  sidebar.classList.toggle('collapsed');
  toggleBtn.classList.toggle('collapsed');
  toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '▶' : '◀';
});
if (window.innerWidth <= 768) { sidebar.classList.add('collapsed'); toggleBtn.classList.add('collapsed'); toggleBtn.textContent = '▶'; }

// ===== 收藏监控 + Bark推送 =====
let favIds = JSON.parse(localStorage.getItem('favIds') || '[]');
let monitorTimer = null;
let monitorFirstCheck = true;

function renderFavList() {
  const el = document.getElementById('favList');
  if (favIds.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = '<div style="margin-top:4px;color:#333;font-weight:600;">监控中（' + favIds.length + '家）：</div>' +
    favIds.map(id => {
      const s = currentData.find(x => String(x.apiId) === String(id));
      return s ? `<div style="padding:2px 0;color:#27ae60;">#${s.id} ${s.name.replace('青年驿站','')}</div>` : '';
    }).join('');
}

window.toggleFav = function(apiId) {
  apiId = String(apiId);
  const idx = favIds.indexOf(apiId);
  if (idx >= 0) favIds.splice(idx, 1);
  else favIds.push(apiId);
  localStorage.setItem('favIds', JSON.stringify(favIds));
  renderFavList();
  rebuildMarkers();
};

document.getElementById('clearFav').addEventListener('click', function() {
  if (favIds.length === 0) return;
  if (!confirm('确定清空全部 ' + favIds.length + ' 个监控？')) return;
  favIds.length = 0;
  localStorage.setItem('favIds', JSON.stringify(favIds));
  renderFavList();
  rebuildMarkers();
  // 更新右侧列表的★
  document.querySelectorAll('.r-bell').forEach(b => { b.classList.remove('on'); b.textContent = '☆'; });
  if (monitorTimer) checkMonitor();
});

async function sendBark(title, body) {
  const key = document.getElementById('barkKey').value.trim();
  if (!key) { addLog('>>> 未填Bark Key，跳过推送', false); return; }
  try {
    const url = `https://api.day.app/${encodeURIComponent(key)}/${encodeURIComponent(title)}/${encodeURIComponent(body)}`;
    const img = new Image();
    img.src = url;
    addLog('>>> Bark推送已发送: '+title, true);
  } catch(e) { addLog('>>> Bark推送失败: '+e.message, false); }
}

function addLog(text, ok) {
  const log = document.getElementById('monitorLog');
  const time = new Date().toLocaleTimeString();
  const color = ok === true ? '#27ae60' : ok === false ? '#e74c3c' : '#666';
  log.innerHTML = `<div style="padding:1px 0;color:${color};">[${time}] ${text}</div>` + log.innerHTML;
}

async function checkMonitor() {
  if (favIds.length === 0) return;
  const dFrom = document.getElementById('dateFrom').value;
  const dTo = document.getElementById('dateTo').value;
  const useDate = dFrom && dTo;

  if (useDate) {
    // 按监控的日期区间查日历
    const newRooms = [];
    for (const id of favIds) {
      const s = currentData.find(x => String(x.apiId) === String(id));
      if (!s) continue;
      try {
        const resp = await fetch(`https://qnyz.shyouth.net/qnyzApi/hous/calendar?id=${id}&startTime=${dFrom}&endTime=${dTo}`);
        const json = await resp.json();
        if (!json.success || !json.data) { addLog(`${s.name.replace('青年驿站','')}: 查询失败`, false); continue; }
        const stayNights = json.data.filter(day => day.applyDate >= dFrom && day.applyDate < dTo);
        let minRooms = 999; let hasData = false;
        stayNights.forEach(day => { hasData = true; const n = parseInt(day.applyNumber)||0; if (n < minRooms) minRooms = n; });
        const old = s.rooms;
        if (hasData && minRooms > 0) { s.rooms = minRooms; s.onShelf = "1"; }
        else { s.rooms = 0; s.onShelf = "0"; }
        addLog(`${s.name.replace('青年驿站','')}: ${s.rooms>0?`可住${s.rooms}间`:'满房'}`, s.rooms>0);
        if (s.rooms > 0 && (monitorFirstCheck || old === 0)) {
          newRooms.push({name: s.name, rooms: s.rooms, district: s.district});
        }
      } catch(e) { addLog(`${s.name.replace('青年驿站','')}: 网络错误`, false); }
    }
    rebuildMarkers();
    if (newRooms.length > 0) {
      const title = `${newRooms.length}家监控驿站${dFrom.slice(5)}可住了！`;
      const body = newRooms.map(r => `${r.name.replace('青年驿站','')} ${r.rooms}间\n${r.addr}`).join('\n\n');
      try { if (Notification.permission === 'granted') new Notification(title, {body}); } catch(e){}
      sendBark(title, body);
      addLog(`>>> 推送Bark: ${newRooms.length}家有房`, true);
    } else {
      addLog(`>>> 无新增可住，不推送`, false);
    }
    document.getElementById('statusBar').textContent = `监控中... ${dFrom}至${dTo} · ${new Date().toLocaleTimeString()}`;
    monitorFirstCheck = false;
  } else {
    // 没选日期，监控总房间数
    try {
      const resp = await fetch('https://qnyz.shyouth.net/qnyzApi/hous/housListBatch', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({housType:1, pageNum:1, pageSize:200})
      });
      const json = await resp.json();
      if (!json.success) return;
      const newRooms = [];
      json.data.forEach(fs => {
        const id = String(fs.id);
        if (!favIds.includes(id)) return;
        const n = parseInt(fs.houseCount)||0;
        const ex = currentData.find(s => String(s.apiId) === id);
        if (ex) {
          const old = ex.rooms;
          ex.rooms = n;
          ex.onShelf = String(fs.isOnShelf||"0");
          if (old === 0 && n > 0) newRooms.push({name: ex.name, rooms: n, district: ex.district});
        }
      });
      rebuildMarkers();
      if (newRooms.length > 0) {
        const title = `${newRooms.length}家监控驿站有房了！`;
        const body = newRooms.map(r => `${r.name.replace('青年驿站','')} ${r.rooms}间\n${r.addr}`).join('\n\n');
        if (Notification.permission === 'granted') new Notification(title, {body});
        sendBark(title, body);
      }
    } catch(e) {}
  }
}

document.getElementById('monitorBtn').addEventListener('click', function() {
  if (monitorTimer) {
    clearInterval(monitorTimer); monitorTimer = null;
    this.textContent = '开始监控（每60秒刷新）';
    this.style.background = '#3498db';
    document.getElementById('statusBar').textContent = '监控已停止';
    showToast('监控已停止');
  } else {
    if (favIds.length === 0) { showToast('先点驿站旁边的☆铃铛，选要监控的驿站'); return; }
    const dFrom = document.getElementById('dateFrom').value;
    const dTo = document.getElementById('dateTo').value;
    if (!dFrom || !dTo) { showToast('先选好入住和离店日期'); return; }
    try { if (Notification.permission !== 'granted') Notification.requestPermission(); } catch(e){}
    monitorFirstCheck = true;
    monitorTimer = setInterval(checkMonitor, 60000);
    this.textContent = `停止监控（${favIds.length}家）`;
    this.style.background = '#e74c3c';
    document.getElementById('statusBar').textContent = `监控中 · ${favIds.length}家 · ${dFrom}至${dTo}`;
    showToast(`开始监控${favIds.length}家驿站`);
    checkMonitor();
  }
});

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 2500);
}

// 测试Bark推送
document.getElementById('testBark').addEventListener('click', function() {
  const key = document.getElementById('barkKey').value.trim();
  if (!key) { showToast('先填Bark Key'); return; }
  const url = `https://api.day.app/${encodeURIComponent(key)}/测试推送/如果你收到了说明Bark配置成功`;
  const img = new Image();
  img.src = url;
  showToast('已发送测试推送，看手机有没有收到');
});

// 默认日期：明天入住，后天离店
(function(){
  const d = new Date(); d.setDate(d.getDate()+1);
  const d2 = new Date(); d2.setDate(d2.getDate()+2);
  const fmt = dt => dt.toISOString().slice(0,10);
  document.getElementById('dateFrom').value = fmt(d);
  document.getElementById('dateTo').value = fmt(d2);
})();

renderFavList();
rebuildMarkers();
refreshRooms();

// 打开右侧面板（手机上默认收起，先看地图）
if (window.innerWidth > 768) {
  document.getElementById('resultPanel').classList.add('open');
}

// 显示全部：清空搜索和筛选，恢复总房间数
document.getElementById('resetList').addEventListener('click', function() {
  document.getElementById('searchBox').value = '';
  checkedDistricts.clear();
  activeRanks.clear();
  document.querySelectorAll('#districtList input').forEach(cb => cb.checked = false);
  document.querySelectorAll('.rank-btn').forEach(b => b.classList.remove('active'));
  applyFilter();
  refreshRooms();
});

// 手机端浮动按钮打开列表
document.getElementById('mobileListBtn').addEventListener('click', function() {
  const panel = document.getElementById('resultPanel');
  panel.classList.toggle('open');
  this.textContent = panel.classList.contains('open') ? '关闭列表' : '驿站列表';
});

// 手机端关闭面板
document.getElementById('closePanel').addEventListener('click', function() {
  document.getElementById('resultPanel').classList.remove('open');
  document.getElementById('mobileListBtn').textContent = '驿站列表';
});

// 搜索框过滤列表
document.getElementById('searchBox').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll('.result-item').forEach(item => {
    const text = item.textContent.toLowerCase();
    item.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
});

// 监控日志清空
function clearLog() { document.getElementById('monitorLog').innerHTML = ''; }
</script>
